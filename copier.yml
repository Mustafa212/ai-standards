# ai-standards — project template
# Layering: base rules -> stack -> org -> project. See README.md.
#
# The org question lives in orgs/orgs.yml: a private copy lists its own orgs there, so pulling
# upstream changes to this file never conflicts with them.
---
!include orgs/orgs.yml
---
_subdirectory: template
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
# Copier's own defaults, plus files one choice leaves out. A condition in the file name would push
# the longest template path past Windows' 260 characters.
_exclude:
  - copier.yaml
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - "{% if use_cases == 'plain' %}BuildGreetingQuery.cs*{% endif %}"
# Created once, then owned by the project. Never overwritten by `copier update`.
_skip_if_exists:
  - README.md
  - CLAUDE.md
  - docs/PROJECT.md
  - .gitattributes
  # Manifests hold the project's own dependencies. Created once; updates never touch them, so they
  # can't collide with what the project added. Anything that changes between standards versions
  # lives in managed files instead (.ai-standards/run.mjs, Makefile, tool configs).
  - package.json
  - angular.json
  - pubspec.yaml
  - pyproject.toml
  - "**/*.csproj"
  - "*.slnx"
# CLAUDE.md is the project's own file; the only thing guaranteed in it is the @AGENTS.md import.
_tasks:
  - command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/scripts/ensure_claude_import.py"
      - "."
    when: "{{ 'claude' in ai_tools }}"
_message_after_copy: |
  Project "{{ project_name }}" scaffolded with ai-standards (org: {{ org }}, stack: {{ stack }}).

  Next:
    1. git init && pre-commit install --install-hooks -t pre-commit -t commit-msg
    2. {% if stack in ["typescript", "angular"] %}npm install{% elif stack == "dotnet" %}dotnet restore{% elif stack == "flutter" %}flutter pub get{% else %}uv sync{% endif %}
    3. {% if stack in ["typescript", "angular"] %}npm run check{% elif stack in ["dotnet", "flutter"] %}bash .ai-standards/check.sh{% else %}make check{% endif %}

stack:
  type: str
  help: Tech stack
  choices:
    TypeScript (Node): typescript
    Angular: angular
    Python: python
    .NET (C#): dotnet
    Flutter: flutter
  default: typescript

architecture:
  type: str
  help: Architecture (each one has its own rules in AGENTS.md)
  choices:
    "Simple: one Web API project + tests": simple
    "Clean Architecture: Domain, Application, Infrastructure, Api": clean
    "Vertical slices: one folder per use case": vertical-slice
  default: simple
  when: "{{ stack == 'dotnet' }}"

use_cases:
  type: str
  help: How Application runs a use case (CQRS and a mediator only where they pay; see the init-project skill)
  choices:
    "Plain handler classes, no CQRS (CRUD, simple rules, HTTP only)": plain
    "CQRS handlers, no library (commands and queries, decorators for cross-cutting work)": handlers
    "CQRS handlers + the Mediator library (MIT; pipeline behaviors, notifications)": mediator
  default: plain
  when: "{{ stack == 'dotnet' and architecture == 'clean' }}"

project_name:
  type: str
  help: Project name
  validator: "{% if not project_name.strip() %}Project name is required{% endif %}"

project_slug:
  type: str
  help: Repo / package slug
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: "{% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits and dashes{% endif %}"

dotnet_name:
  type: str
  help: .NET solution and root namespace (PascalCase)
  default: "{{ project_name | title | replace(' ', '') | replace('-', '') | replace('_', '') }}"
  validator: "{% if not (dotnet_name | regex_search('^[A-Z][A-Za-z0-9]*$')) %}Use PascalCase letters and digits{% endif %}"
  when: "{{ stack == 'dotnet' }}"

package_name:
  type: str
  help: Python or Dart package name
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ stack in ['python', 'flutter'] }}"

description:
  type: str
  help: One-line description
  default: ""

ai_tools:
  type: str
  help: Which AI tools should get instruction files? (AGENTS.md is always generated)
  multiselect: true
  choices:
    Claude Code: claude
    Cursor: cursor
    GitHub Copilot: copilot
  default: [claude]

adopted:
  type: bool
  help: Is this an EXISTING project being brought onto ai-standards? (new project = no)
  default: false

deferred_checks:
  type: str
  help: >-
    Checks the existing code does not pass yet. They run in CI as non-blocking warnings until
    re-enabled (copier update --data 'deferred_checks=[]').
  multiselect: true
  choices:
    Type checking: typecheck
    Coverage threshold: coverage
  default: []
  when: "{{ adopted }}"

coverage_floor:
  type: int
  help: >-
    Coverage % the existing code has today. Enforced as the minimum and raised over time until it
    reaches the org target (ratchet). 0 = enforce the org target right away.
  default: 0
  validator: "{% if coverage_floor < 0 or coverage_floor > 100 %}Use 0-100{% endif %}"
  when: "{{ adopted }}"

standards_source:
  type: str
  help: Where this template lives (used by the monthly auto-update workflow)
  default: "gh:Mustafa212/ai-standards"
