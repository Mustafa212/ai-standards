# Every change to the standards is tested: each stack x org is generated, must pass its own
# check on a fresh scaffold, and every rule in tests/violations must still fire.
name: test templates

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"] # without this, tag pushes never trigger the release job
  schedule:
    - cron: "23 5 * * 1" # weekly: catches upstream tool releases that silently change rules

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [typescript, angular, python, dotnet, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        if: matrix.stack == 'dotnet'
        with:
          dotnet-version: "10.0.x"
      - uses: subosito/flutter-action@v2
        if: matrix.stack == 'flutter'
        with:
          channel: stable
      - run: uv tool install copier
      - run: bash scripts/test-templates.sh
        env:
          STACKS: ${{ matrix.stack }}

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . && claude plugin validate ./plugin

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh plugin/hooks/*.sh template/*claude*/hooks/*.sh*
      - run: python3 scripts/check_rules.py # no rule written twice inside one org
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' # audit.py, rule data, exceptions

  release:
    # Tag a release by moving "## Unreleased" in CHANGELOG.md under a version heading, setting the
    # same version in plugin.json, and pushing a vX.Y.Z tag. Projects pick up tags through `copier update`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, plugin, shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches plugin.json
        run: |
          version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match plugin.json version $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v} " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      # A release published by hand before this job runs is kept, not recreated (that failed v0.7.0).
      - run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
